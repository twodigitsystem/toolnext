<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tn-icon-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="tn-icon-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="tn-icon-slash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="tn-icon-right" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="tn-icon-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4F46E5" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g transform="translate(68, 64) scale(2.35)" filter="url(#tn-icon-glow)">
    <!-- 'T' Horizontal Crossbar -->
    <path d="M 12 28 C 12 21.37 17.37 16 24 16 L 96 16 C 102.63 16 108 21.37 108 28 L 108 40 C 108 46.63 102.63 52 96 52 L 24 52 C 17.37 52 12 46.63 12 40 Z" fill="url(#tn-icon-bar)"/>
    
    <!-- 'T' Vertical Pillar -->
    <path d="M 38 44 L 68 44 L 68 140 C 68 146.63 62.63 152 56 152 L 50 152 C 43.37 152 38 146.63 38 140 Z" fill="url(#tn-icon-stem)"/>

    <!-- 'N' Dynamic Diagonal Blade -->
    <path d="M 52 44 L 118 132 C 122 137.5 128.5 140 134 137 C 139 134.5 141 129 141 123 L 141 106 L 92 40 C 89 36 84 34 80 36 Z" fill="url(#tn-icon-slash)"/>

    <!-- 'N' Right Upright Vector -->
    <path d="M 120 28 C 120 21.37 125.37 16 132 16 L 138 16 C 144.63 16 150 21.37 150 28 L 150 140 C 150 146.63 144.63 152 138 152 L 132 152 C 125.37 152 120 146.63 120 140 Z" fill="url(#tn-icon-right)"/>

    <!-- Precision Pins -->
    <circle cx="135" cy="28" r="4.5" fill="#FFFFFF"/>
    <circle cx="38" cy="28" r="3.5" fill="#00F0FF"/>
  </g>
</svg>