      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="app-n-slash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="app-n-right" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="app-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4F46E5" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#badge-bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#badge-stroke)" stroke-width="3"/>

