  <path d="M 28 128 C 28 72 72 28 128 28 L 384 28 C 440 28 484 72 484 128 C 484 150 430 180 370 190 C 230 210 110 170 28 128 Z" fill="#FFFFFF" fill-opacity="0.04"/>

  <!-- Centered T & N Monogram -->
  <g transform="translate(94, 96) scale(2.05)" filter="url(#app-glow)">
    <path d="M 12 28 C 12 21.37 17.37 16 24 16 L 96 16 C 102.63 16 108 21.37 108 28 L 108 40 C 108 46.63 102.63 52 96 52 L 24 52 C 17.37 52 12 46.63 12 40 Z" fill="url(#app-t-bar)"/>
    <path d="M 38 44 L 68 44 L 68 140 C 68 146.63 62.63 152 56 152 L 50 152 C 43.37 152 38 146.63 38 140 Z" fill="url(#app-t-stem)"/>
    <path d="M 52 44 L 118 132 C 122 137.5 128.5 140 134 137 C 139 134.5 141 129 141 123 L 141 106 L 92 40 C 89 36 84 34 80 36 Z" fill="url(#app-n-slash)"/>
    <path d="M 120 28 C 120 21.37 125.37 16 132 16 L 138 16 C 144.63 16 150 21.37 150 28 L 150 140 C 150 146.63 144.63 152 138 152 L 132 152 C 125.37 152 120 146.63 120 140 Z" fill="url(#app-n-right)"/>
    <circle cx="135" cy="28" r="4.5" fill="#FFFFFF"/>
    <circle cx="38" cy="28" r="3.5" fill="#00F0FF"/>
