<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <title>You're offline | ToolNext</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #faf8ff;
        color: #24213a;
      }
      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }
      main {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid #e8e4f2;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 16px 48px rgb(36 33 58 / 8%);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.75rem;
      }
      p {
        color: #625e75;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 11px 16px;
        border-radius: 12px;
        background: #4f46e5;
        color: white;
        font-weight: 650;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        ToolNext couldn't load this page because the network is unavailable.
        Reconnect and try again. This page won’t send you to a different tool
        or the homepage.
      </p>
      <a href="/">Try the homepage</a>
    </main>
  </body>
</html>
